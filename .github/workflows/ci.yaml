name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: python -m ruff check .
      - name: Check config flows
        run: python tools/check_flows.py
      - name: Test XSIG hub protocol
        run: python tools/test_xsig_hub_protocol.py

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Validate Marketplace catalog (HACS action)
    if: github.event.repository.private != true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate Marketplace integration catalog requirements
        uses: hacs/action@main
        with:
          category: integration
          comment: false
